<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2B1F21">
<title>The Gazette</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23F6E0D8'/%3E%3Ctext x='32' y='47' font-family='Georgia' font-size='44' font-weight='700' text-anchor='middle' fill='%23C8102E'%3EA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@1,400;1,700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--desk:#2B1F21;--paper:#F6E0D8;--ink:#1F1416;--ink2:#4E3B3B;--red:#C8102E}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));background:radial-gradient(ellipse at center,#3B2A2D 0%,#120C0D 75%);color:var(--ink);font-family:Georgia,serif}
.card{width:min(420px,100%);background:var(--paper);padding:26px 24px 24px;box-shadow:0 30px 80px rgba(0,0,0,.7);transform:rotate(-1.5deg);text-align:center}
.m{margin:0;font-family:'UnifrakturMaguntia',Georgia,serif;font-size:clamp(32px,9vw,44px);line-height:1}
.r{display:flex;justify-content:space-between;margin:8px 0 18px;padding:3px 0;border-top:3px double var(--ink);border-bottom:1px solid var(--ink);font-family:'Oswald',Arial,sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
p{margin:0 0 16px;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:18px;line-height:1.35;color:var(--ink2)}
form{display:flex;flex-direction:column;gap:10px}
input[type=password]{width:100%;min-height:50px;padding:0 14px;border:2px solid var(--ink);background:#FFFBF8;font-size:18px;color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none}
input[type=password]:focus{outline:3px solid var(--red);outline-offset:2px}
button{min-height:52px;border:2px solid var(--red);background:var(--red);color:#fff;font-family:'Oswald',Arial,sans-serif;font-weight:600;font-size:17px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
button:disabled{opacity:.6;cursor:wait}
label.keep{display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Oswald',Arial,sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.msg{min-height:22px;margin:12px 0 0;font-family:'Oswald',Arial,sans-serif;font-size:14px;letter-spacing:.04em;color:var(--red)}
.bar{height:4px;margin-top:10px;background:rgba(31,20,22,.15);overflow:hidden;visibility:hidden}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
</style>
</head>
<body>
<main class="card">
  <h1 class="m">The Gazette</h1>
  <div class="r"><span>Private edition</span><span>One reader only</span></div>
  <p>This edition was printed for one person. Enter the password to open it.</p>
  <form id="f" autocomplete="off">
    <input type="password" id="pw" placeholder="Password" aria-label="Password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <label class="keep"><input type="checkbox" id="keep" checked> Remember on this device</label>
    <button id="go" type="submit">Open the newspaper</button>
  </form>
  <div class="bar" id="bar"><i id="barI"></i></div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  'use strict';
  var KEY = 'gazette-pass', head = null;
  var $ = function (id) { return document.getElementById(id); };
  function msg(t) { $('msg').textContent = t; }
  function bar(f) { $('bar').style.visibility = 'visible'; $('barI').style.width = Math.round(f * 100) + '%'; }
  function get(url) { return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('download'); return r.arrayBuffer(); }).then(function (b) { return new Uint8Array(b); }); }
  // the small locked page header is fetched straight away, so unlocking feels instant
  function loadHead() { if (!head) { head = get('page.enc'); head.catch(function () { head = null; }); } return head; }
  function open(key, sealed) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: sealed.slice(0, 12) }, key, sealed.slice(12)); }
  function unlock(pw) {
    var key;
    return loadHead().then(function (buf) {
      if (String.fromCharCode(buf[0], buf[1], buf[2], buf[3]) !== 'AYE2') throw new Error('format');
      var salt = buf.slice(4, 20);
      return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: 310000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      }).then(function (k) { key = k; return open(key, buf.slice(20)); });
    }).then(function (plain) {
      return { key: key, page: JSON.parse(new TextDecoder().decode(plain)) };
    });
  }
  // unlock every photo into an in-memory blob URL, six at a time, with progress
  function photos(key, list) {
    var urls = {}, done = 0, i = 0;
    msg('Printing the newspaper…'); bar(0);
    return new Promise(function (resolve, reject) {
      var active = 0, failed = false;
      function next() {
        if (failed) return;
        if (i >= list.length) { if (!active) resolve(urls); return; }
        var it = list[i++]; active++;
        get('i/' + it[2] + '.bin').then(function (b) { return open(key, b); }).then(function (plain) {
          urls[it[0]] = URL.createObjectURL(new Blob([plain], { type: it[1] }));
          active--; done++; bar(done / list.length); next();
        }).catch(function (e) { failed = true; reject(e); });
      }
      for (var n = 0; n < 6; n++) next();
    });
  }
  // swap this screen for the newspaper in the same page, so the unlocked photos stay available
  function show(html, urls) {
    window.__GZIMG = urls;
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var h = document.head; while (h.firstChild) h.removeChild(h.firstChild);
    Array.prototype.forEach.call(doc.head.children, function (n) { if (n.tagName !== 'SCRIPT') h.appendChild(document.importNode(n, true)); });
    document.title = doc.title;
    document.body.className = doc.body.className; document.body.removeAttribute('style'); document.body.innerHTML = '';
    Array.prototype.forEach.call(doc.body.childNodes, function (n) { document.body.appendChild(document.importNode(n, true)); });
    // copied scripts never run on their own; replace each with a fresh one, in order
    Array.prototype.forEach.call(document.body.querySelectorAll('script'), function (old) { var s = document.createElement('script'); s.textContent = old.textContent; old.parentNode.replaceChild(s, old); });
    window.scrollTo(0, 0);
  }
  function attempt(pw, remembered) {
    $('go').disabled = true; msg(remembered ? 'Opening…' : 'Unlocking…');
    unlock(pw).then(function (r) {
      try { if ($('keep').checked) localStorage.setItem(KEY, pw); else localStorage.removeItem(KEY); } catch (e) {}
      return photos(r.key, r.page.img).then(function (urls) { show(r.page.html, urls); });
    }).catch(function (e) {
      $('go').disabled = false; $('bar').style.visibility = 'hidden';
      if (e && e.message === 'download') msg('Could not download the newspaper. Check the connection and try again.');
      else { msg(remembered ? '' : 'That password is not right. Try again.'); try { localStorage.removeItem(KEY); } catch (er) {} $('pw').value = ''; $('pw').focus(); }
    });
  }
  if (!window.crypto || !crypto.subtle) { msg('This browser cannot open the newspaper. Try Safari or Chrome.'); $('go').disabled = true; return; }
  loadHead().catch(function () {});
  $('f').addEventListener('submit', function (e) { e.preventDefault(); var pw = $('pw').value; if (pw) attempt(pw, false); });
  var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) attempt(saved, true);
})();
</script>
</body>
</html>
